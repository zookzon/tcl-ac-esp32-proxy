substitutions:
  device_name: tcl-ac
  friendly_name: TCL TAC-PRO12PEC

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2025.2.0
  on_boot:
    - priority: 600
      then:
        - lambda: |-
            id(tcl_ac).set_swing_feature_enabled(id(enable_swing_mode));
            id(tcl_ac).set_preset_feature_enabled(id(enable_preset));
            id(tcl_ac).set_target_temperature_step(id(temperature_step_half) ? 0.5f : 1.0f);
    - priority: -100
      then:
        - delay: 5s
        - lambda: |-
            id(feature_switches_armed) = true;
            id(temperature_step_select).publish_state(
              id(temperature_step_half) ? std::string("0.5 °C") : std::string("1.0 °C")
            );

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

external_components:
  - source:
      type: local
      path: components
    components: [tclac]

uart:
  - id: tcl_uart
    tx_pin: GPIO3
    rx_pin: GPIO4
    baud_rate: 115200
    data_bits: 8
    parity: NONE
    stop_bits: 1
    rx_buffer_size: 256
  - id: tcl_dongle_uart
    tx_pin: GPIO6
    rx_pin: GPIO5
    baud_rate: 115200
    data_bits: 8
    parity: NONE
    stop_bits: 1
    rx_buffer_size: 256

logger:
  level: DEBUG
  baud_rate: 115200
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 10dB
  fast_connect: true
  power_save_mode: LIGHT
  ap:
    ssid: "TCLAC C3 Recovery"
    password: !secret fallback_ap_password

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 15min

text:
  - platform: template
    id: humidity_entity_id
    name: Humidity Entity ID
    icon: mdi:water-percent
    entity_category: config
    mode: text
    optimistic: true
    restore_value: true
    min_length: 0
    max_length: 96
    pattern: "^(|sensor\\.[a-z0-9_]+)$"
    on_value:
      then:
        - lambda: id(tcl_ac).set_humidity_entity_id(x);
    set_action:
      - delay: 750ms
      - lambda: App.safe_reboot();

time:
  - platform: sntp
    id: a5_time
    timezone: Asia/Bangkok
    on_time:
      - seconds: 0
        minutes: 0
        hours: 0
        then:
          - lambda: |-
              if (!isnan(id(today_energy).state)) {
                id(yesterday_energy_value) = id(today_energy).state;
                id(yesterday_energy).publish_state(id(yesterday_energy_value));
              }
          - sensor.integration.reset: today_energy
      - seconds: 5
        minutes: 0
        hours: 0
        days_of_month: 1
        then:
          - sensor.integration.reset: monthly_energy

ota:
  - platform: esphome
    password: !secret ota_password

globals:
  - id: enable_swing_mode
    type: bool
    restore_value: yes
    initial_value: 'true'
  - id: enable_preset
    type: bool
    restore_value: yes
    initial_value: 'true'
  - id: temperature_step_half
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: feature_switches_armed
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: yesterday_energy_value
    type: float
    restore_value: yes
    initial_value: '0.0'

sensor:
  - platform: integration
    id: total_energy
    name: Total Energy
    sensor: a5_input_power
    time_unit: h
    integration_method: trapezoid
    restore: false
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
  - platform: integration
    id: today_energy
    name: Today Energy
    sensor: a5_input_power
    time_unit: h
    integration_method: trapezoid
    restore: true
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
  - platform: template
    id: yesterday_energy
    name: Yesterday Energy
    unit_of_measurement: kWh
    device_class: energy
    state_class: total
    accuracy_decimals: 3
    update_interval: 60s
    lambda: |-
      return id(yesterday_energy_value);
  - platform: integration
    id: monthly_energy
    name: Monthly Energy
    sensor: a5_input_power
    time_unit: h
    integration_method: trapezoid
    restore: true
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
  - platform: wifi_signal
    name: Wi-Fi Signal
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    id: uptime_seconds
    name: Uptime Seconds
    internal: true
    update_interval: 60s

climate:
  - platform: tclac
    id: tcl_ac
    uart_id: tcl_uart
    dongle_uart_id: tcl_dongle_uart
    proxy_mode: false
    a5_ack_only: true
    name: Air Conditioner
    beeper: true
    show_display: true
    force_mode: false
    show_module_display: false
    supported_modes: ["OFF", "AUTO", "COOL", "HEAT", "DRY", "FAN_ONLY"]
    supported_fan_modes: ["AUTO", "QUIET", "LOW", "MIDDLE", "MEDIUM", "HIGH", "FOCUS", "DIFFUSE"]
    supported_swing_modes: ["OFF", "VERTICAL", "HORIZONTAL", "BOTH"]
    supported_presets: ["NONE", "ECO", "SLEEP"]
    a5_input_power:
      id: a5_input_power
      name: Input Power
    a5_compressor_target:
      id: a5_compressor_target
      name: Compressor Target
    a5_compressor_actual:
      id: a5_compressor_actual
      name: Compressor Actual
    room_temperature:
      name: Indoor Temperature
    outdoor_ambient_candidate:
      id: outdoor_temperature
      name: Outdoor Temperature
    indoor_coil_temperature:
      id: indoor_coil_temperature
      name: Indoor Coil Temperature
    visual:
      min_temperature: 16 °C
      max_temperature: 31 °C
      temperature_step:
        target_temperature: 1 °C
        current_temperature: 0.1 °C

select:
  - platform: template
    name: Temperature Step
    id: temperature_step_select
    entity_category: config
    optimistic: false
    update_interval: never
    options: ["1.0 °C", "0.5 °C"]
    lambda: |-
      return id(temperature_step_half) ? std::string("0.5 °C") : std::string("1.0 °C");
    set_action:
      - if:
          condition:
            lambda: 'return id(feature_switches_armed);'
          then:
            - lambda: |-
                id(temperature_step_half) = (x == "0.5 °C");
                id(tcl_ac).set_target_temperature_step(id(temperature_step_half) ? 0.5f : 1.0f);
            - delay: 1500ms
            - lambda: App.safe_reboot();

button:
  - platform: restart
    id: restart_button
    name: Restart
    entity_category: diagnostic
  - platform: safe_mode
    name: Restart in Safe Mode
    entity_category: diagnostic

binary_sensor:
  - platform: status
    name: Status
    entity_category: diagnostic

switch:
  - platform: template
    name: Enable RAW A5 Logger
    id: enable_raw_a5_logger_switch
    entity_category: diagnostic
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: |-
      return id(tcl_ac).get_a5_raw_logger();
    turn_on_action:
      - lambda: 'id(tcl_ac).set_a5_raw_logger(true);'
    turn_off_action:
      - lambda: 'id(tcl_ac).set_a5_raw_logger(false);'
  - platform: template
    name: Beep
    id: beep_switch
    entity_category: config
    lambda: |-
      if (!id(tcl_ac).a5_beep_valid()) return {};
      return id(tcl_ac).a5_beep();
    turn_on_action:
      - lambda: 'id(tcl_ac).a5_send_beep_setting_(true);'
    turn_off_action:
      - lambda: 'id(tcl_ac).a5_send_beep_setting_(false);'
  - platform: template
    name: Display Light
    id: display_light_switch
    entity_category: config
    lambda: |-
      if (!id(tcl_ac).a5_display_light_valid()) return {};
      return id(tcl_ac).a5_display_light();
    turn_on_action:
      - lambda: 'id(tcl_ac).a5_send_bool_field_(0x1E, true, "CLIMATE display light");'
    turn_off_action:
      - lambda: 'id(tcl_ac).a5_send_bool_field_(0x1E, false, "CLIMATE display light");'
  - platform: template
    name: Drying
    id: drying_switch
    entity_category: config
    lambda: |-
      if (!id(tcl_ac).a5_drying_valid()) return {};
      return id(tcl_ac).a5_drying();
    turn_on_action:
      - lambda: 'id(tcl_ac).a5_send_bool_field_(0x27, true, "CLIMATE drying");'
    turn_off_action:
      - lambda: 'id(tcl_ac).a5_send_bool_field_(0x27, false, "CLIMATE drying");'
  - platform: template
    name: Health
    id: health_switch
    entity_category: config
    lambda: |-
      if (!id(tcl_ac).a5_health_valid()) return {};
      return id(tcl_ac).a5_health();
    turn_on_action:
      - lambda: 'id(tcl_ac).a5_send_bool_field_(0x15, true, "CLIMATE health");'
    turn_off_action:
      - lambda: 'id(tcl_ac).a5_send_bool_field_(0x15, false, "CLIMATE health");'
  - platform: template
    name: Enable Swing Mode
    id: enable_swing_mode_switch
    entity_category: config
    lambda: |-
      return id(enable_swing_mode);
    turn_on_action:
      - if:
          condition:
            lambda: 'return id(feature_switches_armed);'
          then:
            - lambda: |-
                id(tcl_ac).a5_disable_swing_();
                id(enable_swing_mode) = true;
            - delay: 1500ms
            - lambda: App.safe_reboot();
    turn_off_action:
      - if:
          condition:
            lambda: 'return id(feature_switches_armed);'
          then:
            - lambda: |-
                id(tcl_ac).a5_disable_swing_();
                id(enable_swing_mode) = false;
            - delay: 1500ms
            - lambda: App.safe_reboot();
  - platform: template
    name: Enable Preset
    id: enable_preset_switch
    entity_category: config
    lambda: |-
      return id(enable_preset);
    turn_on_action:
      - if:
          condition:
            lambda: 'return id(feature_switches_armed);'
          then:
            - lambda: |-
                id(tcl_ac).a5_disable_preset_();
                id(enable_preset) = true;
            - delay: 1500ms
            - lambda: App.safe_reboot();
    turn_off_action:
      - if:
          condition:
            lambda: 'return id(feature_switches_armed);'
          then:
            - lambda: |-
                id(tcl_ac).a5_disable_preset_();
                id(enable_preset) = false;
            - delay: 1500ms
            - lambda: App.safe_reboot();

text_sensor:
  - platform: template
    name: Uptime
    id: uptime_formatted
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      uint64_t total = (uint64_t) id(uptime_seconds).state;
      uint64_t days = total / 86400ULL;
      uint8_t hours = (total % 86400ULL) / 3600ULL;
      uint8_t minutes = (total % 3600ULL) / 60ULL;
      uint8_t seconds = total % 60ULL;
      char buffer[40];
      if (days > 0) snprintf(buffer, sizeof(buffer), "%llud %uh %um %us", (unsigned long long) days, hours, minutes, seconds);
      else if (hours > 0) snprintf(buffer, sizeof(buffer), "%uh %um %us", hours, minutes, seconds);
      else if (minutes > 0) snprintf(buffer, sizeof(buffer), "%um %us", minutes, seconds);
      else snprintf(buffer, sizeof(buffer), "%us", seconds);
      return {buffer};

  - platform: wifi_info
    ip_address:
      name: IP Address
      entity_category: diagnostic
    ssid:
      name: Connected SSID
      entity_category: diagnostic
  - platform: version
    name: ESPHome Version
    entity_category: diagnostic
